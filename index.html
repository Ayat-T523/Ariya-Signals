<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ariya Signals</title>
    <meta name="description"
      content="Ariya Competitive Intelligence — real-time market signals, competitor tracking, and strategic alerts." />
    <!-- Open Graph -->
    <meta property="og:title"        content="Ariya Signals" />
    <meta property="og:description"  content="Competitive intelligence platform. Track competitors, signals, and upcoming events." />
    <meta property="og:type"         content="website" />
    <meta property="og:image"        content="/og-image.svg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Ariya Signals" />
    <meta name="twitter:description" content="Competitive intelligence platform." />
    <meta name="twitter:image"       content="/og-image.svg" />
    <meta name="theme-color"         content="#10224A" />
    <meta name="robots"              content="noindex, nofollow" />
    <!-- CSS endpoint: plain fetch (no CORS). Font files: cdn.fontshare.com, fetched with CORS. -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preload" as="style"
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- InForm typography: Plus Jakarta Sans (UI/display) + JetBrains Mono (figures/timestamps).
         Google Fonts — Fontshare doesn't carry either family. Satoshi above stays loaded until
         every component is migrated off it (per-component migration, not a repo-wide swap). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
