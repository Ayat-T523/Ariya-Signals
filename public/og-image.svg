<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#10224A"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E4FFA"/>
      <stop offset="100%" stop-color="#2A76F4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A76F4"/>
      <stop offset="100%" stop-color="rgba(42,118,244,0)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative glow orbs -->
  <ellipse cx="1050" cy="180" rx="240" ry="180" fill="rgba(42,118,244,0.08)"/>
  <ellipse cx="150" cy="480" rx="180" ry="140" fill="rgba(126,79,250,0.07)"/>

  <!-- Left accent bar -->
  <rect x="80" y="230" width="5" height="170" rx="3" fill="url(#accentGrad)"/>

  <!-- Ariya "A" mark — simplified lightning bolt shape -->
  <g transform="translate(110, 215)">
    <path d="M 36 0 L 14 36 h 12 L 8 72 L 50 28 H 36 L 54 0 Z" fill="url(#logoGrad)" opacity="0.9"/>
  </g>

  <!-- Main headline -->
  <text x="185" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Ariya Signals</text>

  <!-- Divider line -->
  <rect x="185" y="308" width="440" height="2" rx="1" fill="rgba(255,255,255,0.12)"/>

  <!-- Subtitle -->
  <text x="185" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="rgba(255,255,255,0.55)" letter-spacing="0">HAE Competitive Intelligence</text>

  <!-- Phamax byline -->
  <text x="185" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="rgba(255,255,255,0.30)">by Phamax</text>

  <!-- Bottom strip -->
  <rect x="0" y="600" width="1200" height="30" fill="#2A76F4" opacity="0.55"/>

  <!-- Status dots (decorative) -->
  <circle cx="80" cy="558" r="5" fill="#49A078"/>
  <text x="95" y="563" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="rgba(255,255,255,0.35)">Monitoring 8 competitors · Updated 21 Apr 2026</text>
</svg>
